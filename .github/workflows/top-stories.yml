name: TradingView alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: Post test messages to all Discord channels now
        type: boolean
        default: false
      dry_run:
        description: Read the feeds and print them, posting nothing
        type: boolean
        default: false
      weekly_pdf:
        description: Send the weekly PDF now, as a test
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: top-stories
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Always start from the latest saved progress. A queued run would otherwise
      # use the progress from when it was triggered, and repeat earlier posts.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Check for new stories
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 watcher.py ${{ inputs.dry_run && '--dry-run' || inputs.test && '--test' || '' }}

      - name: Check the calendars
        if: always()
        env:
          DISCORD_CALENDAR_WEBHOOK_URL: ${{ secrets.DISCORD_CALENDAR_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 calendar_watcher.py ${{ inputs.dry_run && '--dry-run' || inputs.test && '--test' || '' }}

      - name: Compare Substack feeds
        continue-on-error: true
        run: python3 probe_substack.py

      - name: Check Substack
        if: always()
        env:
          DISCORD_SUBSTACK_WEBHOOK_URL: ${{ secrets.DISCORD_SUBSTACK_WEBHOOK_URL }}
        run: python3 substack_watcher.py ${{ inputs.dry_run && '--dry-run' || inputs.test && '--test' || '' }}

      - name: Send the weekly PDF
        if: always()
        env:
          DISCORD_WEEKLY_WEBHOOK_URL: ${{ secrets.DISCORD_WEEKLY_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ inputs.weekly_pdf && '--test' || '' }}
        run: |
          python3 weekly_report.py --check $MODE || exit 0
          python3 -m pip install --quiet --break-system-packages reportlab==5.0.1
          python3 weekly_report.py $MODE

      - name: Save progress
        if: always()
        run: |
          git add '*.json'
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update saved progress"
          git pull --rebase origin main
          git push
