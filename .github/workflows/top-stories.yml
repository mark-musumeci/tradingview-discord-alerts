name: TradingView alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: Post test messages to both Discord channels now
        type: boolean
        default: false
      dry_run:
        description: Read the feeds and print them, posting nothing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: top-stories
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Always start from the latest saved progress. A queued run would otherwise
      # use the progress from when it was triggered, and repeat earlier posts.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Compare feed settings
        continue-on-error: true
        run: python3 probe_feed.py

      - name: Check for new stories
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 watcher.py ${{ inputs.dry_run && '--dry-run' || inputs.test && '--test' || '' }}

      - name: Check the calendars
        if: always()
        env:
          DISCORD_CALENDAR_WEBHOOK_URL: ${{ secrets.DISCORD_CALENDAR_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 calendar_watcher.py ${{ inputs.dry_run && '--dry-run' || inputs.test && '--test' || '' }}

      - name: Save progress
        if: always()
        run: |
          git add '*.json'
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update saved progress"
          git pull --rebase origin main
          git push
